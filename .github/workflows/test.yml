name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest (26.04) has no Python 3.9 build; 22.04 has every version of the matrix.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: pytest -q
