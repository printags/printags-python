[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printags"
dynamic = ["version"]
description = "Python SDK for the Printags API: price, order and track printed PVC, NFC and wooden cards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Printags SAS", email = "contact@printags.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]
keywords = ["printags", "cards", "pvc", "nfc", "printing", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.printags.com"
Documentation = "https://docs.printags.com"
Repository = "https://github.com/printags/printags-python"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.version]
path = "src/printags/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/printags"]
